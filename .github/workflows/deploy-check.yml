name: Post-Deploy Smoke Check

on:
  workflow_dispatch:
    inputs:
      backend_url:
        description: 'Live Render backend base URL (e.g. https://krishisetu-api.onrender.com)'
        required: true
        type: string
      frontend_url:
        description: 'Live Vercel frontend URL (e.g. https://krishisetu.vercel.app)'
        required: false
        type: string

jobs:
  smoke-test:
    name: Live URL Smoke Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install requests
        run: python -m pip install requests==2.34.2

      - name: Run smoke suite
        run: |
          if [ -n "${{ inputs.frontend_url }}" ]; then
            python scripts/smoke.py --backend-url "${{ inputs.backend_url }}" --frontend-url "${{ inputs.frontend_url }}"
          else
            python scripts/smoke.py --backend-url "${{ inputs.backend_url }}"
          fi
