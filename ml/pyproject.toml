[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "krishisetu_ml"
version = "0.1.0"
description = "KrishiSetu AI Crop Recommendation ML Engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26.4",
    "pandas>=2.2.2",
    "scikit-learn>=1.5.2",
    "xgboost>=2.1.3",
    "lightgbm>=4.5.0",
    "joblib>=1.4.2",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["krishisetu_ml*"]

[tool.ruff]
target-version = "py312"
line-length = 88
